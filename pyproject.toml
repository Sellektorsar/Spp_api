[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spp-api-client"
version = "5.3.0"
description = "API Client for Smart Pack Production"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "responses>=0.23.0",
    "allure-pytest>=2.13.0",
    "pytest-ordering>=0.6",
    "python-dotenv>=1.0.0",
]
dev = [
    "black",
    "isort",
    "mypy",
    "flake8",
]

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
