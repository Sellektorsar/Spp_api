[pytest]
minversion = 7.0
# Запускаем только integration и e2e тесты
testpaths = tests/integration tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркеры
markers =
    integration: Интеграционные тесты (цепочки API-вызовов с моками)
    e2e: Сквозные сценарии (полный производственный цикл)
    order: Порядок выполнения E2E сценариев

# Вывод
addopts =
    -v
    --tb=short
    --no-header
    -p no:warnings

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %H:%M:%S
